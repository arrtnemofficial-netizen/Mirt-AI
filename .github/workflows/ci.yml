# =============================================================================
# MIRT AI - Continuous Integration
# =============================================================================
# Runs on every push and pull request to main/develop branches
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Linting
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Critical Ruff Gate (F821/F401)
        run: ruff check --select F821,F401 src/ tests/

      - name: Check AI-smell comment markers (PR merge-base diff)
        run: |
          git fetch --no-tags --depth=1 origin main
          python scripts/check_ai_smell_comments.py --base origin/main --head HEAD --merge-base

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/

  # ---------------------------------------------------------------------------
  # Type Checking
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Run MyPy
        run: mypy src/ --ignore-missing-imports --no-error-summary
        continue-on-error: true  # Make non-blocking initially

  # ---------------------------------------------------------------------------
  # Critical Quality Gates
  # ---------------------------------------------------------------------------
  critical-gates:
    name: Critical Gates
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run smoke gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/smoke/test_graph_builds.py

      - name: Run payment and vision contract gates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/unit/test_payment_node.py tests/test_vision_contract.py

      - name: Run prompt compliance gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/unit/test_prompt_compliance.py

      - name: Run security behavior gate
        env:
          PYTHONPATH: ${{ github.workspace }}
          MANYCHAT_VERIFY_TOKEN: "test-token"
        run: pytest -q tests/security/test_auth_and_rate_limiting.py

      - name: Run STATE_5 scenario gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/scenario/test_state5_scenarios.py

      - name: Run SSOT static smoke gate (router vs intent-node)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/smoke/test_router_intent_ssot_guard.py

      - name: Run checkpoint payload contract gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/contract/test_checkpoint_payload_contract.py

      - name: Run route vs FSM regression gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/regression/test_route_vs_fsm_alignment.py

      - name: Run intent chaos routing gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tests/eval/run_eval.py intent_chaos_v1.json \
            --mode intent-chaos \
            --ci-gate \
            --min-intent-accuracy 0.85 \
            --max-ambiguity-rate 0.45 \
            --max-wrong-payment-routing-rate 0.00 \
            --max-escalation-miss-rate 0.00

  # ---------------------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [critical-gates]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Minimal env for tests
          TELEGRAM_BOT_TOKEN: "123456:test-token"
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_API_KEY: "test-key"
          OPENROUTER_API_KEY: "test-key"
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false


  # ---------------------------------------------------------------------------
  # Smoke Checks (critical-only gate)
  # ---------------------------------------------------------------------------
  smoke_checks:
    name: Smoke Checks
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run startup smoke checks (fail only on critical)
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_BOT_TOKEN: "123456:test-token"
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_API_KEY: "test-key"
          OPENROUTER_API_KEY: "test-key"
        run: |
          python -m src.server.startup_checks --fail-on-critical

  # ---------------------------------------------------------------------------
  # Docker Build
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mirt-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Security Scan
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security linter
        run: bandit -r src/ -ll -ii
        continue-on-error: true

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Deploy (only on main branch)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, docker, smoke_checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🚀 Deployment would happen here"
          echo "Commit: ${{ github.sha }}"
          echo "Add your deployment steps (Railway, Render, etc.)"
